name: Build OnePlus Ace Race T Kernel
on:
  workflow_dispatch:
    inputs:
      MANAGER_SOURCE:
        type: choice
        description: "KernelSU 分支(SPOOF=伪装版管理器)"
        required: true
        default: RESUKISU
        options:
          - RESUKISU
          - RESUKISU_SPOOF
          - SUKISU
          - SUKISU_SPOOF
      KPM:
        type: choice
        description: "内核模块实现方式(仅SukiSU-Ultra支持)"
        required: true
        default: N/A
        options:
          - KPM
          - KPN
          - N/A
      SUSFS_META:
        type: string
        description: "回退SUSFS(输入哈希或次数或-1关闭，SukiSU-Ultra不能关闭)"
        required: false
        default: ""
      BUILD_TIME:
        type: string
        description: "自定义构建时间(默认与原厂内核一致；输入F使用当前UTC时间)"
        required: false
        default: "Mon Oct 24 22:45:30 UTC 2022"
      KSU_META:
        type: string
        description: "分支名(留空用默认)/自定义版本标识(留空不修改)/回退提交哈希(留空不修改)"
        required: false
        default: "//"
      SUFFIX:
        type: string
        description: "自定义内核后缀(默认与原厂内核一致；清空则使用随机字符串)"
        required: false
        default: "9-00011-g8efa13274425-ab9212784"
      SUBLEVEL:
        description: "自定义内核等级欺骗(SUBLEVEL)"
        required: false
        default: ""
      LSM_BBG:
        type: boolean
        description: "是否启用关键分区写入保护模块(BBG)？"
        required: true
        default: true
      CCM:
        type: boolean
        description: "是否编入 BBR / BBRv3 拥塞控制算法？（不改默认算法）"
        required: true
        default: true
      UNICODE_BYPASS:
        type: boolean
        description: "是否添加Unicode不可见字码点绕过读取漏洞修复？"
        required: true
        default: true
      DROID_SPACES:
        type: boolean
        description: "是否添加轻量级Linux容器支持(DroidSpaces)？"
        required: true
        default: false
      RE_KERNEL:
        type: boolean
        description: "是否添加Re-Kernel？"
        required: true
        default: false
      SUSFS_DEV:
        type: boolean
        description: "是否拉取SUSFS-DEV分支？"
        required: true
        default: false
      SPACE_NOCLEAN:
        type: boolean
        description: "是否停用空间清扫？"
        required: true
        default: false
      RELEASE:
        type: boolean
        description: "是否发布到 Release？(默认不发布，需要时手动勾选)"
        required: true
        default: false
      BUILD_NOCCACHE:
        type: boolean
        description: "是否停用此次Ccache？"
        required: true
        default: false

# 本仓库只编译这一台机器：一加 Ace 竞速版（Android 13，天玑 8100）
env:
  FILE: oneplus_ace_race_t

permissions:
  contents: write
  actions: write

jobs:
  build:
    name: ${{ startsWith(github.event.inputs.MANAGER_SOURCE, 'SUKISU') && (github.event.inputs.KPM == 'KPM' && '[SukiSU][KPM] ' || github.event.inputs.KPM == 'KPN' && '[SukiSU][KPN] ' || '[SukiSU] ') || '' }}${{ github.event.inputs.LSM_BBG == 'true' && '[BBG] ' || '' }}${{ github.event.inputs.DROID_SPACES == 'true' && '[DS] ' || '' }}${{ github.event.inputs.RE_KERNEL == 'true' && '[REKER] ' || '' }}OnePlus Ace Race T ${{ github.event.inputs.SUFFIX }}
    runs-on: ubuntu-latest
    # 历次成功构建 10～25 分钟；卡住时 90 分钟后自动终止，而不是占满默认的 6 小时
    timeout-minutes: 90
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      # 与官方 GKI 构建（kernel/build/_setup_env.sh）一致，/proc/version 显示 build-user@build-host 而不是 runner@runnervm...
      KBUILD_BUILD_USER: build-user
      KBUILD_BUILD_HOST: build-host
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CCACHE_MAXSIZE: 8G
      # 固定版本，maintenance.yml 每天检查上游是否有新提交
      AK3_COMMIT: 0fc7569866bb5d5fe51752cc410dca3e92ab332f  # Numbersf/AnyKernel3
      BBG_COMMIT: a54e0dc6cf0aff4dd87fec49644a02d2eb612905  # vc-teahouse/Baseband-guard
      SUKISU_PATCH_COMMIT: 7c6289c95bdc786119b03d150236853b7b4872ca  # SukiSU-Ultra/SukiSU_patch（KPM 工具 patch_linux）
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Maximize Build Space
        if: ${{ github.event.inputs.SPACE_NOCLEAN == 'false' }}
        env:
          ROOT_RESERVE_MB: '8192'
          TEMP_RESERVE_MB: '2048'
        run: |
          cp scripts/maximize-build-space.sh /tmp/
          cd / && bash /tmp/maximize-build-space.sh

      # 扩容后工作目录被新卷覆盖，重新检出仓库（补丁和脚本都在仓库里）
      - name: Checkout After Resize
        if: ${{ github.event.inputs.SPACE_NOCLEAN == 'false' }}
        uses: actions/checkout@v6

      - name: Extract Manifest Info
        id: extract_info
        run: |
          # 源码清单在 manifests/ 目录；设备信息固定，不再按机型动态查找
          test -s "manifests/${FILE}.xml"
          {
            echo "CPU=mt6895"
            echo "CPUD=unknown"
            echo "BUILD_METHOD=gki"
            echo "ANDROID_VERSION=13.0.0"
          } | tee -a "$GITHUB_ENV"
          echo "value=OnePlusAceRace_Android13.0.0" >> "$GITHUB_OUTPUT"

      - name: Debug Show Selected Inputs
        run: |
          echo "------------------------------"

          echo "Selected FILE: ${{ env.FILE }}"
          echo "Selected CPU: ${{ env.CPU }}"
          echo "Selected CPUD: ${{ env.CPUD }}"
          echo "Selected ANDROID_VERSION: ${{ env.ANDROID_VERSION }}"
          echo "Selected BUILD_METHOD: ${{ env.BUILD_METHOD }}"
          echo "Selected MANAGER_SOURCE: ${{ github.event.inputs.MANAGER_SOURCE }}"
          echo "Selected KPM: ${{ github.event.inputs.KPM }}"
          echo "Custom SUSFS_META: ${{ github.event.inputs.SUSFS_META }}"
          echo "Custom KSU_META: ${{ github.event.inputs.KSU_META }}"
          echo "Selected LSM_BBG: ${{ github.event.inputs.LSM_BBG }}"
          echo "Selected CCM: ${{ github.event.inputs.CCM }}"
          echo "Selected SUSFS_DEV: ${{ github.event.inputs.SUSFS_DEV }}"
          echo "Selected UNICODE_BYPASS: ${{ github.event.inputs.UNICODE_BYPASS }}"
          echo "Selected DROID_SPACES: ${{ github.event.inputs.DROID_SPACES }}"
          echo "Selected RE_KERNEL: ${{ github.event.inputs.RE_KERNEL }}"

          BUILD_TIME="${{ github.event.inputs.BUILD_TIME }}"
          SUFFIX="${{ github.event.inputs.SUFFIX }}"

          # BUILD_TIME
          echo "Custom BUILD_TIME: $BUILD_TIME"
          echo -n "BUILD_TIME Unicode: "
          python3 - <<EOF
          import unicodedata, re
          s = """$BUILD_TIME"""
          warn = False
          out = []
          space_count = 0
          for c in s:
              if c == ' ':
                  space_count += 1
                  # 前两个空格允许，之后标红
                  if space_count <= 2:
                      out.append(f'U+{ord(c):04X} ')
                  else:
                      warn = True
                      out.append(f'\033[31mU+{ord(c):04X}\033[0m ')
                  continue
              else:
                  space_count = 0
              if unicodedata.category(c) == 'Cf' or (c.isspace() and c != ' '):
                  warn = True
                  out.append(f'\033[31mU+{ord(c):04X}\033[0m ')
              else:
                  out.append(f'U+{ord(c):04X} ')
          print(''.join(out))
          # 异常字符警告
          if warn:
              print("::warning title=BUILD_TIME Error::检测到自定义构建时间异常符号调用，请注意!")
          EOF

          # SUFFIX
          echo "Custom SUFFIX: $SUFFIX"
          echo -n "SUFFIX Unicode: "
          python3 - <<EOF
          import unicodedata, re
          s = """$SUFFIX"""
          warn = False
          out = []
          for c in s:
              if c.isspace() or unicodedata.category(c) == 'Cf':
                  warn = True
                  out.append(f'\033[31mU+{ord(c):04X}\033[0m ')
              else:
                  out.append(f'U+{ord(c):04X} ')
          print(''.join(out))

          # 异常字符警告
          if warn:
              print("::warning title=SUFFIX Error::检测到自定义内核后缀异常符号调用，请注意!")
          # 格式重复检测
          if re.search(r'^\d{1,3}\.\d{1,3}\.\d{1,3}|-?android\d{2,3}-', s):
              print("::warning title=SUFFIX Format Error::检测到自定义内核后缀存在重复或冗余内容调用，请注意!")
          EOF

          echo "------------------------------"

      - name: Check Disk Space
        run: df -h

      - name: Create and Enable 3G Swap
        run: |
          sudo swapoff -a
          sudo fallocate -l 3G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Set Cache Environment
        if: ${{ github.event.inputs.BUILD_NOCCACHE == 'false' }}
        run: |
          echo "CCACHE_DIR=$HOME/.ccache_${{ env.FILE }}" >> $GITHUB_ENV
          mkdir -p "$HOME/.ccache_${{ env.FILE }}"
          echo "set: $HOME/.ccache_${{ env.FILE }}"

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install Dependencies + APTC
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with: 
          packages: python3 git curl ccache libelf-dev build-essential flex bison libssl-dev libncurses-dev liblz4-tool zlib1g-dev libxml2-utils rsync unzip gawk dos2unix kmod libdw-dev elfutils
          execute_install_scripts: true

      # 缓存写入后不能覆盖，所以每次以运行 ID 结尾保存新缓存，恢复时取同前缀中最新的一份
      - name: Restore Ccache
        if: ${{ github.event.inputs.BUILD_NOCCACHE == 'false' }}
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ github.ref_name }}-${{ env.FILE }}-${{ env.BUILD_METHOD }}-alpha-16.2-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.ref_name }}-${{ env.FILE }}-${{ env.BUILD_METHOD }}-alpha-16.2

      - name: Initialize Ccache
        if: ${{ github.event.inputs.BUILD_NOCCACHE == 'false' }}
        run: |
          INIT_FLAG="${{ env.CCACHE_DIR }}/.ccache_initialized"
          if command -v ccache >/dev/null 2>&1; then
            if [ ! -f "$INIT_FLAG" ]; then
              echo "初始化 ccache (${{ env.CCACHE_DIR }})..."
              mkdir -p "${{ env.CCACHE_DIR }}"
              ccache -M ${{ env.CCACHE_MAXSIZE }}
              touch "$INIT_FLAG"
              echo "✅ ccache 初始化完成"
            else
              echo "✅ ccache 已初始化，跳过"
            fi
          else
            echo "❌ 未安装 ccache，跳过"
          fi
          ccache -s

      - name: Install Repo Tool
        run: |
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/repo
          chmod a+x ~/repo
          sudo mv ~/repo /usr/local/bin/repo

      - name: Initialize Repo and Sync
        run: |
          # 把仓库里的清单做成本地 git 仓库交给 repo，不依赖外部清单仓库
          MANIFEST_GIT="$RUNNER_TEMP/kernel_manifest"
          mkdir -p "$MANIFEST_GIT"
          cp "manifests/${FILE}.xml" "$MANIFEST_GIT/default.xml"
          git -C "$MANIFEST_GIT" init -q -b main
          git -C "$MANIFEST_GIT" add default.xml
          git -C "$MANIFEST_GIT" commit -q -m "manifest: ${FILE}"

          mkdir kernel_workspace && cd kernel_workspace
          repo init -u "file://$MANIFEST_GIT" -b main -m default.xml --depth=1 --no-clone-bundle --no-tags
          repo sync -c -j$(nproc) --no-clone-bundle --no-tags --force-sync

          KERNEL_REPOS=""
          KERNEL_REPOS_PATH=$(find . -type f -name "build.config.msm.common" | head -n 1)
          if [[ -n "$KERNEL_REPOS_PATH" ]]; then
            KERNEL_REPOS=$(echo "${KERNEL_REPOS_PATH#./}" | cut -d/ -f2)
            echo "✅ 发现 build.config.msm.common: $KERNEL_REPOS_PATH"
            echo "✅ KERNEL_REPOS=$KERNEL_REPOS"
            echo "KERNEL_REPOS=$KERNEL_REPOS" >> "$GITHUB_ENV"
          else
            echo "❎ 未找到 build.config.msm.common，可能是天玑清单或纯 Kleaf 构建结构"
          fi

          for dir in kernel_platform/common kernel_platform/$KERNEL_REPOS; do
            if [ -e "$dir/BUILD.bazel" ]; then
              sed -i '/^[[:space:]]*"protected_exports_list"[[:space:]]*:[[:space:]]*"android\/abi_gki_protected_exports_aarch64",$/d' "$dir/BUILD.bazel"
            fi
            rm -f "$dir/android/abi_gki_protected_exports_"* 2>/dev/null || echo "No protected exports in $dir"
          done

      - name: Kernel Version Handling
        run: |
          cd kernel_workspace/kernel_platform
          # 获取内核 Android 版本号(KANDROID_VERSION)以及内核版本号(KERNEL_VERSION)
          for f in ./common/build.config.constants ./common/build.config.common; do
            if [ -f "$f" ]; then
              BRANCH=$(grep -m1 '^BRANCH=' "$f" | cut -d= -f2)
              [ -n "$BRANCH" ] && break
            fi
          done
          if [[ -z "$BRANCH" && -n "$KERNEL_REPOS" ]]; then
            BRANCH=$(grep -m1 '^android' "./$KERNEL_REPOS/android/ACK_SHA" | cut -d- -f1,2)
          fi
          if [ -n "$BRANCH" ]; then
            echo "KANDROID_VERSION=${BRANCH%-*}" >> $GITHUB_ENV
            echo "KERNEL_VERSION=${BRANCH#*-}" >> $GITHUB_ENV
          else
            echo "No BRANCH found in build.config* and ACK_SHA files"
          fi

          # 从 Makefile 获取完整内核版本号(TKERNEL_VERSION)以及可选的修改内核等级
          ORIG_VERSION=$(awk '/^VERSION =/ {v=$3} /^PATCHLEVEL =/ {p=$3} /^SUBLEVEL =/ {s=$3} END {print v"."p"."s}' ./common/Makefile)

          # 强制修改 SUBLEVEL(内核等级)
          SUBLEVEL_INPUT="${{ github.event.inputs.SUBLEVEL }}"
          if [ -n "$SUBLEVEL_INPUT" ]; then
            echo "修改 SUBLEVEL 为 $SUBLEVEL_INPUT"
            sed -i "s/^\(SUBLEVEL[[:space:]]*=[[:space:]]*\).*/\1$SUBLEVEL_INPUT/" ./common/Makefile
          else
            echo "未指定 SUBLEVEL，保持默认"
          fi

          # 读取修改后的版本
          NEW_VERSION=$(awk '/^VERSION =/ {v=$3} /^PATCHLEVEL =/ {p=$3} /^SUBLEVEL =/ {s=$3} END {print v"."p"."s}' ./common/Makefile)

          if [ "$ORIG_VERSION" != "$NEW_VERSION" ]; then
            echo "Kernel Version:$ORIG_VERSION->$NEW_VERSION"
            echo "TKERNEL_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          else
            echo "Kernel Version:$ORIG_VERSION No changes"
            echo "TKERNEL_VERSION=$ORIG_VERSION" >> $GITHUB_ENV
          fi

          echo "KERNEL_SHORT_VERSION=$(echo $NEW_VERSION | cut -d. -f1,2)" >> $GITHUB_ENV
          echo "KERNEL_SHORT_PATCH_VERSION=$(echo $NEW_VERSION | cut -d. -f1,2 | tr '.' '_')" >> $GITHUB_ENV


      # 自定义内核后缀（留空则随机）
      - name: Custom Kernel Suffix
        run: |
          cd kernel_workspace
          SUFFIX="${{ github.event.inputs.SUFFIX }}"
          if [[ -z "$SUFFIX" ]]; then
            # 留空时生成官方风格的随机后缀，例如 7-o-g1a2b3c4d5e6f70
            RANDOM_DIGIT=$(od -An -N1 -tu1 < /dev/urandom | tr -d '[:space:]' | awk '{print $1 % 11}')
            RANDOM_HASH=$(od -An -N7 -tx1 /dev/urandom | tr -d ' \n')
            SUFFIX="${RANDOM_DIGIT}-o-g${RANDOM_HASH}"
          fi
          echo "内核版本后缀: -${KANDROID_VERSION}-${SUFFIX}"

          # 版本号写死为固定字符串，与 git 状态无关，因此不会出现 -dirty
          for path in \
            kernel_platform/common/scripts/setlocalversion \
            kernel_platform/$KERNEL_REPOS/scripts/setlocalversion \
            kernel_platform/external/dtc/scripts/setlocalversion; do

            [ -f "$path" ] || continue
            echo "Modifying: $path"

            sed -i 's/ -dirty//g' "$path"
            sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' "$path"

            if grep -q 'KERNELVERSION.*scm_version' "$path"; then
              echo "Detected NEW setlocalversion format"
              sed -i "s|echo \"\${KERNELVERSION}.*scm_version}\"|echo \"\${KERNELVERSION}-${KANDROID_VERSION}-${SUFFIX}\"|" "$path"
            elif grep -q 'echo "\$res"' "$path"; then
              echo "Detected OLD setlocalversion format"
              sed -i "s|^res=.*|res=\"-${KANDROID_VERSION}-${SUFFIX}\"|" "$path"
            else
              echo "Unknown format, appending echo manually"
              echo "echo \"\$res-${SUFFIX}\"" >> "$path"
            fi
          done

      - name: Resolve Manager Source
        id: manager
        run: |
          MANAGER_SOURCE="${{ github.event.inputs.MANAGER_SOURCE }}"

          # ARTIFACT 为上游 build-manager.yml 产物名（区分大小写）
          case "$MANAGER_SOURCE" in
            RESUKISU)       REPO="Baka-SU/BakaSU";            ARTIFACT="Manager-release";         DEFAULT_KSU_BRANCH="main" ;;
            RESUKISU_SPOOF) REPO="Baka-SU/BakaSU";            ARTIFACT="Spoofed-Manager-release"; DEFAULT_KSU_BRANCH="main" ;;
            # SukiSU-Ultra：内核取 builtin 分支（内置 SUSFS 接口），管理器取 main 分支 CI；
            # MIUIX / Material 3 两种界面已合并到同一个管理器，在管理器设置中切换
            SUKISU)         REPO="SukiSU-Ultra/SukiSU-Ultra"; ARTIFACT="Manager";                 DEFAULT_KSU_BRANCH="builtin" ;;
            SUKISU_SPOOF)   REPO="SukiSU-Ultra/SukiSU-Ultra"; ARTIFACT="Manager-spoofed";         DEFAULT_KSU_BRANCH="builtin" ;;
            *)
              echo "::error title=MANAGER_SOURCE::未知的选项 $MANAGER_SOURCE"
              exit 1
              ;;
          esac

          if [[ "$REPO" == "SukiSU-Ultra/SukiSU-Ultra" && "${{ github.event.inputs.SUSFS_META }}" == "-1" ]]; then
            # builtin 分支没有自己的 syscall/kprobe 钩子，execve、faccessat、stat 等钩子由 SUSFS 内核补丁调用；
            # 关闭 SUSFS 也能编译通过，但刷入后没有 root，所以直接拒绝
            echo "::error title=SUSFS_META::SukiSU-Ultra builtin 依赖 SUSFS 提供内核钩子，不能关闭 SUSFS（SUSFS_META=-1）"
            exit 1
          fi

          echo "manager_branch=main" >> "$GITHUB_OUTPUT"
          echo "manager_artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "manager_repo=$REPO" >> "$GITHUB_OUTPUT"
          echo "default_ksu_branch=$DEFAULT_KSU_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Add KernelSU
        run: |
          cd kernel_workspace/kernel_platform
          MANAGER_REPO="${{ steps.manager.outputs.manager_repo }}"
          DEFAULT_KSU_BRANCH="${{ steps.manager.outputs.default_ksu_branch }}"
          KSU_META="${{ github.event.inputs.KSU_META }}"
          # 固定源码提交；maintenance.yml 检查上游，release 标签及其提交单独记录
          # TAG 仅记录最近的 release 标签，不再用它 checkout 默认内核或选择默认 APK。
          RESUKISU_TAG="v4.2.0-rc3"
          RESUKISU_COMMIT="5b76b884c75f729a220bb317aa4a4fc78f0e0e9c"  # BakaSU，35222/UAPI 5；SUSFS 限制之前的最后一个主线提交
          RESUKISU_RELEASE_COMMIT="239e1e8871b8fcd51a6e5b3002e0ba522fdd99fb"  # v4.2.0-rc3 release APK 对应的旧提交，仅显式回退到此提交时使用
          SUKISU_BUILTIN_COMMIT="7f1c299af463d008e66e714077eb6a8079ff722b"  # SukiSU-Ultra builtin 分支（v4.2.1，UAPI 6），已核对与固定的 SUSFS 接口一致

          # 必须包含两个分隔符（至少三个字段）
          if [[ "$(grep -o '/' <<< "$KSU_META" | wc -l)" -lt 2 ]]; then
            echo "错误: KSU_META 参数缺少必要的分隔符 '/'，格式应为: 分支名/自定义标识(可省略)/提交hash(可省略)"
            exit 10
          fi
          # 解析字段：分支 / 自定义标识 / 手动 hash
          IFS='/' read -r USER_BRANCH CUSTOM_TAG MANUAL_HASH <<< "$KSU_META"
          # 自定义标识会写进内核版本名，只保留安全字符
          CUSTOM_TAG=$(printf '%s' "$CUSTOM_TAG" | tr -cd 'A-Za-z0-9._+~-')
          if [[ -n "$MANUAL_HASH" && ! "$MANUAL_HASH" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
            echo "::error title=KSU_META::第三段应为提交哈希（7～40 位十六进制），实际为: $MANUAL_HASH"
            exit 10
          fi

          IS_RESUKISU=false
          [[ "$MANAGER_REPO" == "Baka-SU/BakaSU" ]] && IS_RESUKISU=true
          echo "IS_RESUKISU=$IS_RESUKISU" >> "$GITHUB_ENV"
          if [[ "$IS_RESUKISU" == true && "$USER_BRANCH" == "builtin" ]]; then
            echo "ReSukiSU 不存在 builtin 分支，改用固定版本"
            USER_BRANCH=""
          fi
          BRANCH_NAME="${USER_BRANCH:-$DEFAULT_KSU_BRANCH}"  # 写进版本名

          # 默认用固定版本；填了分支或提交哈希时用指定的版本（Release 会标为预发布）
          EXPECT_COMMIT=""
          if [[ -n "$MANUAL_HASH" ]]; then
            KSU_REF="$MANUAL_HASH"
          elif [[ -n "$USER_BRANCH" ]]; then
            KSU_REF="origin/$USER_BRANCH"
          elif [[ "$IS_RESUKISU" == true ]]; then
            KSU_REF="$RESUKISU_COMMIT"; EXPECT_COMMIT="$RESUKISU_COMMIT"
          else
            KSU_REF="$SUKISU_BUILTIN_COMMIT"; EXPECT_COMMIT="$SUKISU_BUILTIN_COMMIT"
          fi
          echo "KernelSU: ${MANAGER_REPO} @ ${KSU_REF}"
          [[ -n "$CUSTOM_TAG" ]] && echo "自定义版本标识: $CUSTOM_TAG" || echo "自定义版本标识: 未启用"

          # 完整克隆：版本号由提交数计算（SukiSU-Ultra 按 main 分支提交数），版本名取自 tag。
          # 不用官方 setup.sh：它会 pull/stash，并且 checkout 失败时只打印一行就继续，可能悄悄用错版本
          git clone -q "https://github.com/${MANAGER_REPO}.git" KernelSU
          git -C KernelSU -c advice.detachedHead=false checkout -q "$KSU_REF"
          ACTUAL_COMMIT=$(git -C KernelSU rev-parse HEAD)
          if [[ -n "$EXPECT_COMMIT" && "$ACTUAL_COMMIT" != "$EXPECT_COMMIT" ]]; then
            echo "::error title=KernelSU::$KSU_REF 指向 $ACTUAL_COMMIT，与固定的 $EXPECT_COMMIT 不一致"
            exit 1
          fi
          if [[ "$IS_RESUKISU" != true ]] && ! grep -qx 'config KSU_SUSFS' KernelSU/kernel/Kconfig; then
            echo "::error title=KernelSU::SukiSU-Ultra ${KSU_REF} 不是 builtin 结构（没有内置 SUSFS 接口），本工作流只支持 builtin 分支"
            exit 1
          fi

          # 不删除/绕过上游 SUSFS 编译限制；自定义新提交时提前给出清晰错误。
          if [[ "$IS_RESUKISU" == true && "${{ github.event.inputs.SUSFS_META }}" != "-1" ]] &&
             grep -qE '^[[:space:]]*\$\(error[[:space:]]+Please wait susfs update\.' KernelSU/kernel/tools/susfs_compat.mk; then
            echo "::error title=BakaSU/SUSFS::${ACTUAL_COMMIT::8} 的上游源码禁止带 SUSFS 编译；请使用固定的 5b76b884 或等待上游解除限制，不要删除错误检查"
            exit 1
          fi

          # 接入内核（等同于官方 setup.sh 的接入步骤）
          DRIVER_DIR="common/drivers"; [[ -d "$DRIVER_DIR" ]] || DRIVER_DIR="drivers"
          ln -sfn "$(realpath --relative-to="$DRIVER_DIR" KernelSU/kernel)" "$DRIVER_DIR/kernelsu"
          grep -q "kernelsu" "$DRIVER_DIR/Makefile" || printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> "$DRIVER_DIR/Makefile"
          grep -q 'source "drivers/kernelsu/Kconfig"' "$DRIVER_DIR/Kconfig" || sed -i '/endmenu/i\source "drivers/kernelsu/Kconfig"' "$DRIVER_DIR/Kconfig"
          echo "已接入: $(readlink "$DRIVER_DIR/kernelsu") @ ${ACTUAL_COMMIT::8}"

          echo "KSU_SHA=$ACTUAL_COMMIT" >> "$GITHUB_ENV"
          echo "KSU_PINNED=$([[ -n "$EXPECT_COMMIT" ]] && echo true || echo false)" >> "$GITHUB_ENV"
          # 只有源码确实对应 release，才可附带该 release 的管理器。
          # 默认 5b76b884 必须取同一提交的 CI，不能误附 239e1e88 的 APK。
          if [[ "$IS_RESUKISU" == true && "$ACTUAL_COMMIT" == "$RESUKISU_RELEASE_COMMIT" ]]; then
            echo "RESUKISU_RELEASE=$RESUKISU_TAG" >> "$GITHUB_ENV"
          fi

          cd ./KernelSU
          GIT_HASH=$(git rev-parse --short=8 HEAD)
          if [[ "$IS_RESUKISU" == true ]]; then
            KSU_VERSION_TAG=$(git describe --abbrev=0 --tags 2>/dev/null || true)
          else
            # builtin 分支与 main 历史独立、没有 tag；取 main 上最新的 tag（与上游 Makefile 取最新 release 一致）
            KSU_VERSION_TAG=$(git describe --abbrev=0 --tags origin/main 2>/dev/null || true)
          fi
          KSU_VERSION_TAG="${KSU_VERSION_TAG:-0.0.0}"
          KSU_VERSION_TAG="${KSU_VERSION_TAG#v}"
          if [[ "$IS_RESUKISU" != true ]]; then
            # 管理器与内核的 UAPI 版本必须相同（不同时管理器提示需要更新内核/管理器，并禁用大部分功能）
            KSU_UAPI=$(grep -ohP 'KERNEL_SU_UAPI_VERSION\s*(=|,)\s*\K[0-9]+' kernel/include/uapi/supercall.h 2>/dev/null | head -n1 || true)
            echo "内核 UAPI 版本: ${KSU_UAPI:-未知}"
            echo "KSU_UAPI=${KSU_UAPI}" >> "$GITHUB_ENV"
          fi
          echo "KSU_VERSION_TAG=$KSU_VERSION_TAG" >> "$GITHUB_ENV"

          if grep -q 'KSU_FULL_NAME_FORMAT' kernel/Kbuild 2>/dev/null; then
            # ReSukiSU：版本名由 CONFIG_KSU_FULL_NAME_FORMAT 生成，不改源码（改动会让版本名带上 -dirty）
            if [[ -n "$CUSTOM_TAG" ]]; then
              echo "KSU_NAME_FORMAT=%TAG_NAME%-${CUSTOM_TAG}@%REPO_NAME%[%COMMIT_SHA%]" >> "$GITHUB_ENV"
              echo "版本名格式: %TAG_NAME%-${CUSTOM_TAG}@%REPO_NAME%[%COMMIT_SHA%]"
            fi
          else
            # SukiSU-Ultra：Makefile 里 detached HEAD 会显示成 @HEAD，这里写成固定的版本名
            if [[ -z "$CUSTOM_TAG" ]]; then
              VERSION_FULL="v$KSU_VERSION_TAG-$GIT_HASH@$BRANCH_NAME"
            else
              VERSION_FULL="v${KSU_VERSION_TAG}-${CUSTOM_TAG}@${BRANCH_NAME}[${GIT_HASH}]"
            fi
            ESC_VERSION_FULL=$(printf '%s' "$VERSION_FULL" | sed 's/[&|\\/]/\\&/g')
            if ! grep -q '^KSU_VERSION_FULL := ' kernel/Makefile; then
              echo "::error title=KernelSU::kernel/Makefile 中没有 KSU_VERSION_FULL，无法写入版本名"
              exit 1
            fi
            sed -i "s|^KSU_VERSION_FULL := .*|KSU_VERSION_FULL := $ESC_VERSION_FULL|" kernel/Makefile
            echo "版本名: $VERSION_FULL"
          fi
          # 刷新 git 索引：只改了时间戳的文件不应被判定为改动（否则 ReSukiSU 版本名带 -dirty）
          git update-index -q --refresh || true

          # 预估版本号；编译后以内核实际打印的版本号为准
          if [[ "$IS_RESUKISU" == true ]]; then
            COMMIT_COUNT=$(git rev-list --count HEAD)
            KSU_VERSION=$((30000 + COMMIT_COUNT + 700))
          else
            # 与上游 Makefile 相同：40000 + main 分支提交数 - 2815（builtin 分支自身的提交数不参与计算）
            COMMIT_COUNT=$(git rev-list --count origin/main)
            KSU_VERSION=$((40000 + COMMIT_COUNT - 2815))
          fi
          echo "预估版本号: $KSU_VERSION (提交数 $COMMIT_COUNT)"
          echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV

          echo "::group::Makefile 中的版本信息"
          grep -nE '^(REPO_OWNER|REPO_NAME|REPO_BRANCH|KSU_VERSION_FULL|VERSION_BASE|VERSION_OFFSET)' kernel/Makefile || true
          echo "::endgroup::"

      - name: Pair SukiSU-Ultra Manager
        if: ${{ env.IS_RESUKISU != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 编译前选好要附带的管理器，并把内核的 KernelSU 版本号设成该管理器的 versionCode。
          # 上游 builtin 的 Makefile 按 main 分支“编译时”的提交数计算版本号（越晚编译越大），
          # 而 UAPI 匹配的管理器通常是更早的正式版，两者不同时管理器首页提示“管理器版本与 KernelSU 驱动版本不匹配”
          MANAGER_BRANCH="${{ steps.manager.outputs.manager_branch }}"
          MANAGER_ARTIFACT="${{ steps.manager.outputs.manager_artifact }}"
          MANAGER_REPO="${{ steps.manager.outputs.manager_repo }}"
          MAKEFILE="kernel_workspace/kernel_platform/KernelSU/kernel/Makefile"
          STAGE="$GITHUB_WORKSPACE/manager_apk"
          mkdir -p "$STAGE"

          ATTACHED=()
          fetch_artifact() {  # 运行ID [产物名...]（默认 $MANAGER_ARTIFACT）
            local run=$1 url="" art=""; shift
            local names=("$@"); [[ ${#names[@]} -gt 0 ]] || names=("$MANAGER_ARTIFACT")
            for art in "${names[@]}"; do
              url=$(gh api "repos/${MANAGER_REPO}/actions/runs/${run}/artifacts?per_page=100" \
                --jq ".artifacts[] | select(.name == \"$art\" and (.expired | not)) | .archive_download_url" | head -n1 || true)
              [[ -n "$url" ]] && break
            done
            [[ -n "$url" ]] || return 1
            echo "下载 CI 产物: $art（运行 $run）"
            curl -fL --retry 3 -H "Authorization: token $GITHUB_TOKEN" -o "${art}.zip" "$url" || return 1
            # 产物里有多个架构，只要 arm64-v8a（没有时才全部解压）
            local tmp; tmp=$(mktemp -d)
            unzip -oj "${art}.zip" "*.apk" -d "$tmp" >/dev/null
            local apks=("$tmp"/*arm64-v8a*.apk)
            [[ -f "${apks[0]}" ]] || apks=("$tmp"/*.apk)
            for apk in "${apks[@]}"; do
              name=$(basename "$apk")
              [[ "$art" == *[Ss]poofed* && "$name" != *[Ss]poofed* ]] && name="Spoofed_${name}"
              mv "$apk" "$STAGE/$name"
              ATTACHED+=("$name")
              echo "已选择: $name"
            done
          }

          pick_manager() {
            # SukiSU-Ultra：管理器必须与内核 UAPI 版本相同，否则提示"需要更新内核"并禁用大部分功能。
            # builtin 分支的 UAPI 可能与正式版/main 不同（例如 builtin 为 6 时 v4.2.1 正式版仍是 5），所以不能直接取最新管理器：
            # 先找 UAPI 相同的最新正式版，再看 main 最新 CI；都不匹配时不附带，避免装上不能用的管理器
            if [[ -z "${KSU_UAPI:-}" ]]; then
              echo "::warning title=Manager::未能读取内核 UAPI 版本，本次不附带管理器"
              return 1
            fi
            uapi_of() {  # 提交 → 该提交源码中的 KERNEL_SU_UAPI_VERSION（读不到为空）
              gh api -H "Accept: application/vnd.github.raw" "repos/${MANAGER_REPO}/contents/uapi/supercall.h?ref=$1" 2>/dev/null \
                | grep -oP 'KERNEL_SU_UAPI_VERSION\s*(=|,)\s*\K[0-9]+' | head -n1 || true
            }
            SPOOF=false; [[ "$MANAGER_ARTIFACT" == *[Ss]poofed* ]] && SPOOF=true
            echo "内核 UAPI 版本: $KSU_UAPI；伪装版: $SPOOF"

            # 候选 1：UAPI 相同的最新正式版
            REL_TAG="" REL_SHA="" REL_APK=""
            for TAG in $(gh api "repos/${MANAGER_REPO}/releases?per_page=10" \
                --jq '.[] | select((.draft | not) and (.prerelease | not)) | .tag_name' || true); do
              SHA=$(gh api "repos/${MANAGER_REPO}/commits/${TAG}" --jq .sha 2>/dev/null || true)
              [[ -n "$SHA" ]] || continue
              U=$(uapi_of "$SHA"); echo "  正式版 ${TAG}: UAPI ${U:-未知}"
              if [[ "$U" == "$KSU_UAPI" ]]; then
                REL_TAG="$TAG" REL_SHA="$SHA"
                REL_APK=$(gh api "repos/${MANAGER_REPO}/releases/tags/${TAG}" \
                  --jq '.assets[] | select(.name | endswith("-release.apk")) | .browser_download_url' | head -n1 || true)
                break
              fi
            done
            # 候选 2：main 分支最近一次成功的 push 构建
            MAIN_RUN="" MAIN_UAPI=""
            read -r MAIN_RUN MAIN_SHA < <(gh api "repos/${MANAGER_REPO}/actions/workflows/build-manager.yml/runs?branch=${MANAGER_BRANCH}&event=push&status=success&per_page=1" \
              --jq '.workflow_runs[0] | "\(.id) \(.head_sha)"' 2>/dev/null || true) || true
            [[ -n "${MAIN_SHA:-}" ]] && MAIN_UAPI=$(uapi_of "$MAIN_SHA")
            echo "  main 最新 CI ${MAIN_SHA::8}: UAPI ${MAIN_UAPI:-未知}"
            [[ "$MAIN_UAPI" == "$KSU_UAPI" ]] || MAIN_RUN=""

            if [[ "$SPOOF" == true ]]; then
              if [[ -n "$REL_SHA" ]]; then
                RUN_ID=$(gh api "repos/${MANAGER_REPO}/actions/workflows/build-manager.yml/runs?head_sha=${REL_SHA}&status=success&per_page=20" \
                  --jq '[.workflow_runs[] | select(.event == "push")][0].id // empty' || true)
                if [[ -n "$RUN_ID" ]] && fetch_artifact "$RUN_ID" Manager-spoofed Spoofed-Manager; then
                  # 旧版 CI 的伪装版文件名不含版本（Spoofed-Manager.apk），补上版本名（版本号与正式版不同，不写）
                  for f in "${ATTACHED[@]}"; do
                    if [[ "$f" != SukiSU_* ]]; then
                      mv "$STAGE/$f" "$STAGE/SukiSU_${REL_TAG}-spoofed.apk" && echo "重命名: $f → SukiSU_${REL_TAG}-spoofed.apk"
                    fi
                  done
                  echo "管理器: ${REL_TAG} 伪装版"; return 0
                fi
              fi
              if [[ -n "$MAIN_RUN" ]] && fetch_artifact "$MAIN_RUN" Manager-spoofed Spoofed-Manager; then
                echo "管理器: main ${MAIN_SHA::8} 伪装版"; return 0
              fi
              if [[ -n "$REL_APK" ]]; then
                echo "::warning title=Manager::与内核 UAPI ${KSU_UAPI} 匹配的伪装版管理器已过期，改为附带 ${REL_TAG} 普通版"
                curl -fL --retry 3 -o "$STAGE/$(basename "$REL_APK")" "$REL_APK" && return 0
              fi
            else
              if [[ -n "$REL_APK" ]]; then
                echo "管理器: ${REL_TAG} 正式版 $(basename "$REL_APK")"
                curl -fL --retry 3 -o "$STAGE/$(basename "$REL_APK")" "$REL_APK" && return 0
              fi
              if [[ -n "$MAIN_RUN" ]] && fetch_artifact "$MAIN_RUN" Manager; then
                echo "管理器: main ${MAIN_SHA::8}"; return 0
              fi
            fi
            return 1
          }

          if ! pick_manager; then
            echo "::warning title=Manager::没有找到与内核 UAPI ${KSU_UAPI:-未知} 匹配的 SukiSU-Ultra 管理器，本次不附带（不匹配的管理器会提示需要更新内核且无法使用）"
            exit 0
          fi

          # 以 APK 实际的 versionCode 为准（读不到时取文件名中的版本号）
          APK=$(find "$STAGE" -maxdepth 1 -name '*.apk' | sort | head -n1)
          CODE=$(python3 scripts/apk_version_code.py "$APK" || true)
          [[ "$CODE" =~ ^[0-9]+$ ]] || CODE=$(basename "$APK" | grep -oP '_\K[0-9]{5,}(?=[-_.])' | head -n1 || true)
          if [[ ! "$CODE" =~ ^[0-9]+$ ]]; then
            echo "::warning title=KSU Version::读不到 $(basename "$APK") 的版本号，内核版本号保持上游计算值（管理器可能提示版本不匹配）"
            exit 0
          fi
          if [[ "$(grep -c '^KSU_VERSION[[:space:]]*:=' "$MAKEFILE")" != 1 ]]; then
            echo "::warning title=KSU Version::KernelSU Makefile 中没有唯一的 KSU_VERSION 定义，内核版本号保持上游计算值（管理器可能提示版本不匹配）"
            exit 0
          fi
          sed -i "s|^KSU_VERSION[[:space:]]*:=.*|KSU_VERSION     := ${CODE}|" "$MAKEFILE"
          grep -n '^KSU_VERSION[[:space:]]*:=' "$MAKEFILE"
          echo "内核 KernelSU 版本号: ${KSUVER} → ${CODE}（与管理器 $(basename "$APK") 一致）"
          echo "KSUVER=$CODE" >> "$GITHUB_ENV"
          echo "MANAGER_VERSION_CODE=$CODE" >> "$GITHUB_ENV"

      - name: Apply SUSFS
        run: |
          cd kernel_workspace
          if [ "${{ github.event.inputs.SUSFS_META }}" != "-1" ]; then
            SUSFS_META="${{ github.event.inputs.SUSFS_META }}"
            # SUSFS 固定版本 v2.3.0（gki-android12-5.10 分支，包含 6c931c0d 的 SELinux 状态修复和 31eb14ad 的 selinux_hide sidtab 同步修复）
            STABLE_SUSFS_COMMIT="31eb14add587b0a089dfe1819f92cc94920e141e"
            if [[ -z "$SUSFS_META" && "${{ github.event.inputs.SUSFS_DEV }}" != "true" ]]; then
              SUSFS_META="$STABLE_SUSFS_COMMIT"
              echo "SUSFS 固定版本: $SUSFS_META"
            fi
            git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-${{ env.KANDROID_VERSION }}-${{ env.KERNEL_VERSION }}${{ github.event.inputs.SUSFS_DEV == 'true' && '-dev' || '' }}
            cd susfs4ksu
            if [[ -z "$SUSFS_META" ]]; then
              echo "SUSFS 使用开发分支最新提交"
            elif [[ "$SUSFS_META" =~ ^[0-9]+$ ]]; then
              git checkout HEAD~$SUSFS_META
            else
              git -c advice.detachedHead=false checkout "$SUSFS_META"
            fi
            SUSFS_VER=$(grep -o 'SUSFS_VERSION "[^"]*"' kernel_patches/include/linux/susfs.h | cut -d'"' -f2)
            echo "SUSFS: $(git log -1 --format='%h %s') ($SUSFS_VER)"
            echo "SUSFS_VER=$SUSFS_VER" >> "$GITHUB_ENV"
            echo "SUSFS_SHA=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_ENV"
            cd ..
          fi
          if [ "${{ github.event.inputs.RE_KERNEL }}" = "true" ]; then
            git clone --depth=1 https://github.com/Sakion-Team/Re-Kernel.git
          fi
          if [ "${{ github.event.inputs.SUSFS_META }}" != "-1" ]; then
            GKI_V="${{ env.KANDROID_VERSION }}-${{ env.KERNEL_VERSION }}"
            SUSFS_DIR="$PWD/susfs4ksu/kernel_patches"
            # common 是指向 kernel-5.10 的软链接，相对路径会按真实路径解析，所以用绝对路径
            cd kernel_platform/common
            echo "正在拉取susfs补丁"
            cp "$SUSFS_DIR/50_add_susfs_in_gki-${GKI_V}.patch" ./
            cp "$SUSFS_DIR"/fs/* ./fs/
            cp "$SUSFS_DIR"/include/linux/* ./include/linux/

            echo "正在打susfs补丁"
            python3 "$GITHUB_WORKSPACE/scripts/susfs_fixups.py" pre .
            if ! patch -p1 --no-backup-if-mismatch < 50_add_susfs_in_gki-${GKI_V}.patch; then
              echo "::error title=SUSFS::SUSFS 补丁有部分没有打上，继续编译会缺少隐藏功能"
              find . -name '*.rej' -print -exec cat {} \;
              exit 1
            fi
            python3 "$GITHUB_WORKSPACE/scripts/susfs_fixups.py" post .
            if [[ "$IS_RESUKISU" != true ]]; then
              # SukiSU-Ultra builtin 与 SUSFS 补丁的变量类型不一致（ksu_su_compat_enabled），见脚本说明
              python3 "$GITHUB_WORKSPACE/scripts/ksu_susfs_compat.py" "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/KernelSU/kernel" .
            fi
            echo "susfs_patch完成"
          fi

      - name: Apply UNICODE_BYPASS
        if: ${{ github.event.inputs.UNICODE_BYPASS == 'true' }}
        run: |
          PATCH_DIR="${GITHUB_WORKSPACE}/patches"
          cd kernel_workspace/kernel_platform/common
          P="${PATCH_DIR}/unicode_bypass_fix_6.1-.patch"
          if patch -p1 -R --dry-run -s -f < "$P" >/dev/null 2>&1; then
            echo "Unicode 修复已存在，跳过"
          elif ! patch -p1 --no-backup-if-mismatch < "$P"; then
            echo "::error title=UNICODE_BYPASS::Unicode 修复补丁没有完整打上"
            find . -name '*.rej' -print -exec cat {} \;
            exit 1
          fi

      - name: Apply BBRv3
        if: ${{ github.event.inputs.CCM == 'true' && env.KANDROID_VERSION == 'android12' && env.KERNEL_VERSION == '5.10' }}
        run: |
          PATCH_DIR="${GITHUB_WORKSPACE}/patches/bbrv3"
          cd kernel_workspace/kernel_platform/common
          apply() {
            if ! patch -p1 --no-backup-if-mismatch < "$1"; then
              echo "::error title=BBRv3::$(basename "$1") 没有完整打上"
              find . -name '*.rej' -print -exec cat {} \;
              exit 1
            fi
          }
          apply "${PATCH_DIR}/0001-net-tcp-backport-BBRv3-to-android12-5.10.patch"
          # BBRv3 的 sysctl 需要 proc_dou8vec_minmax（5.13 引入），旧内核补上
          if ! grep -qF 'int proc_dou8vec_minmax(' ./include/linux/sysctl.h; then
            apply "${PATCH_DIR}/sysctl_add_proc_dou8vec_minmax.patch"
            apply "${PATCH_DIR}/sysctl_fix_data-races_in_proc_dou8vec_minmax.patch"
          fi
          echo "BBRV3_APPLIED=true" >> "$GITHUB_ENV"

      - name: Apply RE_KERNEL
        if: ${{ github.event.inputs.RE_KERNEL == 'true' }}
        run: |
          RE_DIR="${GITHUB_WORKSPACE}/kernel_workspace/Re-Kernel/LKM-Source"
          cd kernel_workspace/kernel_platform/common
          sed -i '/endmenu/i source "drivers/rekernel/Kconfig"' drivers/Kconfig
          sed -i '$a \#Re-Kernel Support\nobj-$(CONFIG_REKERNEL) += rekernel/' drivers/Makefile
          mkdir -p drivers/rekernel
          cp ${RE_DIR}/rekernel.c ${RE_DIR}/rekernel.h ${RE_DIR}/Makefile ${RE_DIR}/Kconfig drivers/rekernel/
          sed -i "s|^\s*//\s*#define KERNEL_${KERNEL_SHORT_PATCH_VERSION}|\#define KERNEL_${KERNEL_SHORT_PATCH_VERSION}|" drivers/rekernel/rekernel.h

      - name: Apply DROID_SPACES
        if: ${{ github.event.inputs.DROID_SPACES == 'true' }}
        run: |
          cd kernel_workspace/kernel_platform/common
          # 检查原始的 sysv 结构体定义并修改
          sed -i 's/struct sysv_sem\s*sysvsem;/\/\/ struct sysv_sem sysvsem;/g' include/linux/sched.h
          sed -i 's/struct sysv_shm\s*sysvshm;/\/\/ struct sysv_shm sysvshm;/g' include/linux/sched.h
          # 检查 KABI 槽位空闲并修改
          if grep -q "ANDROID_KABI_USE(1," include/linux/sched.h; then
            echo "✅ 检测到 USE(1)，使用槽位 6,7,8"
            sed -i -e '/ANDROID_KABI_RESERVE(6);/{N;N;s|ANDROID_KABI_RESERVE(6);\n\s*ANDROID_KABI_RESERVE(7);\n\s*ANDROID_KABI_RESERVE(8);|#ifdef CONFIG_SYSVIPC\n\tANDROID_KABI_USE(6, struct sysv_sem sysvsem);\n\t_ANDROID_KABI_REPLACE(ANDROID_KABI_RESERVE(7); ANDROID_KABI_RESERVE(8), struct sysv_shm sysvshm);\n#else\n\tANDROID_KABI_RESERVE(6);\n\tANDROID_KABI_RESERVE(7);\n\tANDROID_KABI_RESERVE(8);\n#endif|;}' include/linux/sched.h
          elif grep -q "ANDROID_KABI_RESERVE(1);" include/linux/sched.h; then
            echo "✅ 检测到 RESERVE(1)，使用槽位 1,2,3"
            sed -i -e '/ANDROID_KABI_RESERVE(1);/{N;N;s|ANDROID_KABI_RESERVE(1);\n\s*ANDROID_KABI_RESERVE(2);\n\s*ANDROID_KABI_RESERVE(3);|#ifdef CONFIG_SYSVIPC\n\tANDROID_KABI_USE(1, struct sysv_sem sysvsem);\n\t_ANDROID_KABI_REPLACE(ANDROID_KABI_RESERVE(2); ANDROID_KABI_RESERVE(3), struct sysv_shm sysvshm);\n#else\n\tANDROID_KABI_RESERVE(1);\n\tANDROID_KABI_RESERVE(2);\n\tANDROID_KABI_RESERVE(3);\n#endif|;}' include/linux/sched.h
          elif grep -q "ANDROID_KABI_RESERVE(3);" include/linux/sched.h; then
            echo "✅ fallback，使用槽位 3,4,5"
            sed -i -e '/ANDROID_KABI_RESERVE(3);/{N;N;s|ANDROID_KABI_RESERVE(3);\n\s*ANDROID_KABI_RESERVE(4);\n\s*ANDROID_KABI_RESERVE(5);|#ifdef CONFIG_SYSVIPC\n\tANDROID_KABI_USE(3, struct sysv_sem sysvsem);\n\t_ANDROID_KABI_REPLACE(ANDROID_KABI_RESERVE(4); ANDROID_KABI_RESERVE(5), struct sysv_shm sysvshm);\n#else\n\tANDROID_KABI_RESERVE(3);\n\tANDROID_KABI_RESERVE(4);\n\tANDROID_KABI_RESERVE(5);\n#endif|;}' include/linux/sched.h
          else
            echo "❌ 无法通过上下文精准匹配 KABI 槽位"
            exit 1
          fi

      - name: Apply LSM_BBG
        if: ${{ github.event.inputs.LSM_BBG == 'true' }}
        run: |
          cd kernel_workspace/kernel_platform/common
          echo "正在启用内核级基带保护支持（Baseband-guard ${BBG_COMMIT::8}）"
          # setup.sh 只能按分支/标签克隆，所以先自己克隆并切到固定提交，脚本会沿用已有目录
          git clone -q https://github.com/vc-teahouse/Baseband-guard.git Baseband-guard
          git -C Baseband-guard -c advice.detachedHead=false checkout -q "$BBG_COMMIT"
          bash -o pipefail -c 'curl -fLSs "https://raw.githubusercontent.com/vc-teahouse/Baseband-guard/${BBG_COMMIT}/setup.sh" | bash -s "$BBG_COMMIT"'
          test "$(git -C Baseband-guard rev-parse HEAD)" = "$BBG_COMMIT"
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' ./security/Kconfig

      # 配置信息，带*为附加项目，具有一定危险性和不确定性
      - name: Add Configuration Settings
        run: |
          cd kernel_workspace/kernel_platform/common
          CONFIG_FILE=./arch/arm64/configs/gki_defconfig
          KERNEL_VERSION="${{ env.KERNEL_VERSION }}"

          # SukiSU Ultra配置
          echo "CONFIG_KSU=y" >> "$CONFIG_FILE"
          # 用户命名空间：部分容器和沙盒类应用需要
          echo "CONFIG_USER_NS=y" >> "$CONFIG_FILE"
          if [ -n "${KSU_NAME_FORMAT:-}" ]; then
            echo "CONFIG_KSU_FULL_NAME_FORMAT=\"${KSU_NAME_FORMAT}\"" >> "$CONFIG_FILE"
          fi

          # KPM配置：只有选 KPM 才开启（开启后必须用 patch_linux 处理 Image）；N/A 和 KPN 都关闭
          if [ "${{ github.event.inputs.KPM }}" = "KPM" ]; then
            echo "CONFIG_KPM=y" >> "$CONFIG_FILE"
          else
            echo "CONFIG_KPM=n" >> "$CONFIG_FILE"
          fi

          # SUSFS配置
          if [ "${{ github.event.inputs.SUSFS_META }}" != "-1" ]; then
            echo "CONFIG_KSU_SUSFS=y" >> "$CONFIG_FILE"
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> "$CONFIG_FILE"
            echo "CONFIG_KSU_SUSFS_SUS_MAP=y" >> "$CONFIG_FILE"
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> "$CONFIG_FILE"
            echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> "$CONFIG_FILE"
            echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> "$CONFIG_FILE"
            echo "CONFIG_KSU_SUSFS_ENABLE_LOG=n" >> "$CONFIG_FILE"  # 日志会写进 dmesg，可能被检测
            echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> "$CONFIG_FILE"
            echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> "$CONFIG_FILE"
            echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> "$CONFIG_FILE"
          else
            echo "CONFIG_KSU_SUSFS=n" >> "$CONFIG_FILE"
          fi

          # TMPFS配置*
          echo "CONFIG_TMPFS_XATTR=y" >> "$CONFIG_FILE"
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> "$CONFIG_FILE"

          # BBR 配置*（ECN 不需要编译选项：任何内核都可用 sysctl net.ipv4.tcp_ecn 开关）
          if [ "${{ github.event.inputs.CCM }}" = "true" ]; then
            echo "CONFIG_TCP_CONG_ADVANCED=y" >> "$CONFIG_FILE"
            echo "CONFIG_TCP_CONG_BBR=y" >> "$CONFIG_FILE"
            if [ "${BBRV3_APPLIED:-}" = "true" ]; then
              echo "CONFIG_TCP_CONG_BBR3=y" >> "$CONFIG_FILE"
            fi
            echo "CONFIG_NET_SCH_FQ=y" >> "$CONFIG_FILE"
            echo "CONFIG_TCP_CONG_BIC=n" >> "$CONFIG_FILE"
            echo "CONFIG_TCP_CONG_WESTWOOD=n" >> "$CONFIG_FILE"
            echo "CONFIG_TCP_CONG_HTCP=n" >> "$CONFIG_FILE"
            echo "CONFIG_IP_NF_TARGET_ECN=y" >> "$CONFIG_FILE"
          fi

          # Re-Kernel配置*
          if [ "${{ github.event.inputs.RE_KERNEL }}" = "true" ]; then
            echo "CONFIG_REKERNEL=y" >> "$CONFIG_FILE"
            echo "CONFIG_REKERNEL_NETWORK=y" >> "$CONFIG_FILE"
          fi

          # LSM配置*
          if [ "${{ github.event.inputs.LSM_BBG }}" = "true" ]; then
            echo "CONFIG_BBG=y" >> "$CONFIG_FILE"
          fi

          # DROID_SPACES配置*
          if [ "${{ github.event.inputs.DROID_SPACES }}" = "true" ]; then
            echo "CONFIG_SYSVIPC=y" >> "$CONFIG_FILE"
            echo "CONFIG_DEVTMPFS=y" >> "$CONFIG_FILE"
            echo "CONFIG_PID_NS=y" >> "$CONFIG_FILE"
            echo "CONFIG_POSIX_MQUEUE=y" >> "$CONFIG_FILE"
            echo "CONFIG_NETFILTER_XT_TARGET_LOG=y" >> "$CONFIG_FILE"
            echo "CONFIG_NETFILTER_XT_MATCH_RECENT=y" >> "$CONFIG_FILE"
          fi

          # 移除构建审查
          sed -i 's/check_defconfig//' ./build.config.gki


      # Custom kernel build time, without adding #1 SMP PREEMPT 自定义内核构建时间，不要加入#1 SMP PREEMPT
      - name: Custom BUILD_TIME
        shell: bash
        run: |
          INPUT_TIME="${{ github.event.inputs.BUILD_TIME }}"
          if [[ -n "$INPUT_TIME" && "$INPUT_TIME" != "F" && "$INPUT_TIME" != "f" ]]; then
            DATESTR="$INPUT_TIME"
            echo "Using input BUILD_TIME: $DATESTR"
          else
            DATESTR="$(TZ='UTC' date +'%a %b %d %T %Z %Y')"
            echo "Using UTC time as fallback: $DATESTR"
          fi
          echo "KBUILD_BUILD_TIMESTAMP=${DATESTR}" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_VERSION=1" >> "$GITHUB_ENV"
          cd kernel_workspace/kernel_platform/
          for f in common/scripts/mkcompile_h $KERNEL_REPOS/scripts/mkcompile_h; do
            if [ -f "$f" ]; then
              echo "Patching mkcompile_h with BUILD_TIME=$DATESTR"
              if grep -q 'UTS_VERSION=' "$f"; then
                perl -pi -e "s{UTS_VERSION=\"\\\$\\(.*?\\)\"}{UTS_VERSION=\"#1 SMP PREEMPT $DATESTR\"}" "$f"
              else
                perl -0777 -pi -e "s{cat <<EOF}{cat <<EOF\n#undef UTS_VERSION\n#define UTS_VERSION \"#1 SMP PREEMPT $DATESTR\" } unless /UTS_VERSION/" "$f"
              fi
            fi
          done

      - name: Disable GPUEB
        if: ${{ env.KERNEL_VERSION == '5.10' && startsWith(env.CPU, 'mt') }}
        run: |
          echo "Disabling GPUEB for MTK kernel 5.10"
          sed -i '/obj-y.*gpueb/d' kernel_workspace/kernel-5.10/drivers/gpu/mediatek/Makefile

      - name: Build Kernel FAST
        id: fast_build
        run: |
          KERNEL_VERSION="${{ env.KERNEL_VERSION }}"
          cd kernel_workspace/kernel_platform

          # 自动检测 LLVM_IAS
          if [[ -f ./common/build.config.arm ]] && grep -q '^LLVM_IAS=1' ./common/build.config.arm; then
            USE_LLVM_IAS=true
          else
            USE_LLVM_IAS=false
          fi

          # 从 build.config.common 读取 CLANG_PREBUILT_BIN
          CLANG_PREBUILT_BIN=""
          for f in ./common/build.config.common ./"$KERNEL_REPOS"/build.config.common; do
            [[ -f "$f" ]] || continue
            CLANG_PREBUILT_BIN=$(grep '^CLANG_PREBUILT_BIN=' "$f" | cut -d'=' -f2)
            [[ -n "$CLANG_PREBUILT_BIN" ]] && break
          done
          if [[ -z "$CLANG_PREBUILT_BIN" ]]; then
            echo "⚠️ CLANG_PREBUILT_BIN 未在 build.config.common 中找到，回退至官方构建脚本"
            echo "fallback=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 优先尝试从 CLANG_PREBUILT_BIN 提取 clang-r 版本
          if [[ "$CLANG_PREBUILT_BIN" =~ (clang-r[0-9a-z]+) ]]; then
            CLANG_VERSION="${BASH_REMATCH[1]}"
          else
            # 如果未匹配到，尝试从 build.config.constants 提取
            if [[ -f ./common/build.config.constants ]]; then
              CLANG_VERSION=$(grep '^CLANG_VERSION=' ./common/build.config.constants | cut -d'=' -f2 || true)
            fi
          fi

          if [[ -z "$CLANG_VERSION" ]]; then
            echo "⚠️ 未能从 CLANG_PREBUILT_BIN 或 build.config.constants 获取到 Clang 版本，回退至官方构建脚本"
            echo "fallback=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 替换成新的 CLANG_VERSION 值
          CLANG_PREBUILT_BIN=${CLANG_PREBUILT_BIN/\$\{CLANG_VERSION\}/$CLANG_VERSION}
          # 获取 CLANG_PREBUILT_BIN 的第一个目录名，赋值给 CLANG_DIR
          CLANG_DIR=$(echo "$CLANG_PREBUILT_BIN" | cut -d'/' -f1)
          # 获取 CLANG_PREBUILT_BIN 的上一级目录名，赋值给 CLANG_PATH
          CLANG_PATH=$(basename "$(dirname "$CLANG_PREBUILT_BIN")")

          echo "-----------------------"
          echo "✅ CLANG_VERSION=$CLANG_VERSION"
          echo "✅ CLANG_DIR=$CLANG_DIR"
          echo "✅ CLANG_PATH=$CLANG_PATH"
          echo "✅ USE_LLVM_IAS=$USE_LLVM_IAS"
          echo "-----------------------"

          set +u
          source "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/build/kernel/_setup_env.sh" 2>/dev/null || true
          set -u

          export PATH="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/$CLANG_PREBUILT_BIN:$PATH"
          export PATH="/usr/lib/ccache:$PATH"

          cd ./common

          # 重映射物理路径
          COMMON_REAL_PATH=$(pwd -P)
          PLATFORM_REAL_PATH=$(dirname "$COMMON_REAL_PATH")
          ROOT_REAL_PATH=$(dirname "$PLATFORM_REAL_PATH")
          MAP="-fdebug-prefix-map=$ROOT_REAL_PATH=."
          MPMAP="-fmacro-prefix-map=$ROOT_REAL_PATH=."
          FPMAP="-ffile-prefix-map=$ROOT_REAL_PATH=."

          # KCFLAGS
          KCFLAGS="$MAP $MPMAP $FPMAP -no-canonical-prefixes -Wno-error -D__ANDROID_COMMON_KERNEL__"

          MAKE_ARGS=(
            LLVM=1
            ARCH=arm64
            CROSS_COMPILE=aarch64-linux-gnu-
            CC="ccache clang"
            HOSTCC="ccache clang"
            LD=ld.lld
            HOSTLD=ld.lld
            PAHOLE=../../prebuilts/kernel-build-tools/linux-x86/bin/pahole
            KCFLAGS="$KCFLAGS"
          )

          if [[ "$USE_LLVM_IAS" == "true" ]]; then
            MAKE_ARGS=(LLVM_IAS=1 "${MAKE_ARGS[@]}")
          fi
          make O=out "${MAKE_ARGS[@]}" gki_defconfig
          if [[ "$KERNEL_VERSION" == "5.10" || "$KERNEL_VERSION" == "5.15" ]]; then
            echo ">> 设置 LTO = thin"
            scripts/config --file out/.config -e LTO_CLANG
            scripts/config --file out/.config -e LTO_CLANG_THIN
            scripts/config --file out/.config -d LTO_CLANG_NONE
            scripts/config --file out/.config -d LTO_CLANG_FULL
          fi

          echo ">> 显式启用 seccomp"
          scripts/config --file out/.config -e SECCOMP
          scripts/config --file out/.config -e SECCOMP_FILTER
          make O=out "${MAKE_ARGS[@]}" olddefconfig
          grep '^CONFIG_SECCOMP=' out/.config || true
          grep '^CONFIG_SECCOMP_FILTER=' out/.config || true
          set -o pipefail
          make -j"$(nproc --all)" O=out "${MAKE_ARGS[@]}" 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          ccache -s

      # 快速编译找不到工具链时，改用官方脚本编译
      - name: Fallback to Build Kernel
        if: ${{ steps.fast_build.outputs.fallback == 'true' }}
        run: |
          cd kernel_workspace
          set -o pipefail
          LTO=thin SYSTEM_DLKM_RE_SIGN=0 BUILD_SYSTEM_DLKM=0 KMI_SYMBOL_LIST_STRICT_MODE=0 \
          ./kernel_platform/oplus/build/oplus_build_kernel.sh ${{ env.CPUD }} ${{ env.BUILD_METHOD }} 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"

      - name: Save Ccache
        if: ${{ success() && github.event.inputs.BUILD_NOCCACHE == 'false' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ github.ref_name }}-${{ env.FILE }}-${{ env.BUILD_METHOD }}-alpha-16.2-${{ github.run_id }}

      - name: Prune Old Ccache
        if: ${{ success() && github.event.inputs.BUILD_NOCCACHE == 'false' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PREFIX: ccache-${{ runner.os }}-${{ github.ref_name }}-${{ env.FILE }}-${{ env.BUILD_METHOD }}-alpha-16.2
        run: |
          KEEP="${PREFIX}-${{ github.run_id }}"
          LIST=$(gh api --paginate "repos/${{ github.repository }}/actions/caches?key=${PREFIX}&per_page=100" --jq '.actions_caches[] | [.id, .key] | @tsv')
          if ! grep -qxF "$KEEP" <<< "$(cut -f2 <<< "$LIST")"; then
            echo "新缓存未保存成功，保留旧缓存"
            exit 0
          fi
          while IFS=$'\t' read -r id key; do
            [[ "$key" == "$KEEP" ]] && continue
            echo "删除旧缓存: $key"
            gh api -X DELETE "repos/${{ github.repository }}/actions/caches/$id" >/dev/null
          done <<< "$LIST"

      - name: Detect KSU Version
        run: |
          # ReSukiSU 打印 "-- ReSukiSU version code: N"，SukiSU-Ultra 打印 "-- SukiSU-Ultra version: N [...]"
          LOG="$GITHUB_WORKSPACE/build.log"
          CODE=$(grep -aoE -- '-- [A-Za-z-]+ version( code)?: [0-9]+' "$LOG" 2>/dev/null | tail -n1 | grep -oE '[0-9]+$' || true)
          NAME=$(grep -aoE -- '-- [A-Za-z-]+ version name: .*' "$LOG" 2>/dev/null | tail -n1 | sed 's/.*version name: //' || true)
          [[ -z "$NAME" ]] && NAME=$(grep -aoE -- '-- [A-Za-z-]+ version: [0-9]+ \[[^]]*\]' "$LOG" 2>/dev/null | tail -n1 | sed -E 's/.*\[(.*)\]/\1/' || true)
          if [[ -n "$CODE" ]]; then
            echo "✅ 内核实际版本号: $CODE${NAME:+ ($NAME)}"
            echo "KSUVER=$CODE" >> "$GITHUB_ENV"
            [[ -n "$NAME" ]] && echo "KSU_NAME=$NAME" >> "$GITHUB_ENV"
            if [[ "$CODE" != "$KSUVER" ]]; then echo "预估值 $KSUVER 已更正为 $CODE"; fi
          else
            echo "::warning title=KSU Version::未能从编译日志读取版本号，刷机包名使用预估值 $KSUVER"
          fi
          if [[ -n "${MANAGER_VERSION_CODE:-}" && -n "$CODE" && "$CODE" != "$MANAGER_VERSION_CODE" ]]; then
            echo "::warning title=KSU Version::内核版本号 $CODE 与附带的管理器 $MANAGER_VERSION_CODE 不一致，管理器会提示版本不匹配"
          fi
          if [[ "$NAME" == *-dirty* ]]; then
            echo "::warning title=KSU Version::版本名带有 -dirty：$NAME"
          fi

      - name: Make AnyKernel3
        run: |
          echo "AnyKernel3 固定提交: ${AK3_COMMIT::8}"
          git init -q AnyKernel3
          git -C AnyKernel3 fetch -q --depth=1 https://github.com/Numbersf/AnyKernel3 "$AK3_COMMIT"
          git -C AnyKernel3 -c advice.detachedHead=false checkout -q FETCH_HEAD
          rm -rf ./AnyKernel3/.git
          mkdir -p kernel_workspace/kernel_platform/out/Final-Image-Find/
          image_path=""
          if [ -d "./kernel_workspace/kernel_platform/common/out/" ]; then
            image_path=$(find "./kernel_workspace/kernel_platform/common/out/" -name "Image" | head -n 1)
            if [ -n "$image_path" ]; then
              echo "✅ 使用 make 编译的统一路径，成功找到 Image 文件"
            fi
          fi
          if [ -z "$image_path" ] && [ -d "./kernel_workspace/kernel_platform/out/" ]; then
            image_path=$(find "./kernel_workspace/kernel_platform/out/" -name "Image" | head -n 1)
            if [ -n "$image_path" ]; then
              echo "✅ 使用官方脚本编译，成功找到 Image 文件"
            fi
          fi
          if [ -z "$image_path" ]; then
            echo "❌ 未找到 Image 文件，构建失败" >&2
            exit 1
          fi
          if [ -f "$image_path" ]; then
            echo "✅ Image file finally located at: $image_path"
            cp "$image_path" ./AnyKernel3/Image
            cp "$image_path" kernel_workspace/kernel_platform/out/Final-Image-Find/Image
          fi

      - name: Apply KPX and Replace Image
        if: ${{ github.event.inputs.KPM != 'N/A' }}
        run: |
          if [ "$IS_RESUKISU" = "true" ]; then
            echo "::warning title=KPM::ReSukiSU 不支持 KPM/KPN，已跳过"
            exit 0
          fi
          KPM_DIR="${GITHUB_WORKSPACE}/kernel_workspace/SukiSU_patch/kpm"
          if [ "${{ github.event.inputs.KPM }}" = "KPM" ] && [ ! -d "$KPM_DIR" ]; then
            echo "SukiSU_patch 固定提交: ${SUKISU_PATCH_COMMIT::8}"
            git init -q "${GITHUB_WORKSPACE}/kernel_workspace/SukiSU_patch"
            git -C "${GITHUB_WORKSPACE}/kernel_workspace/SukiSU_patch" fetch -q --depth=1 https://github.com/SukiSU-Ultra/SukiSU_patch.git "$SUKISU_PATCH_COMMIT"
            git -C "${GITHUB_WORKSPACE}/kernel_workspace/SukiSU_patch" -c advice.detachedHead=false checkout -q FETCH_HEAD
          fi
          KPN_DIR="${GITHUB_WORKSPACE}/patches"
          OUT_DIR="${GITHUB_WORKSPACE}/kernel_workspace/kernel_platform/out/Final-Image-Find"
          cd "${OUT_DIR}"
          if [ "${{ github.event.inputs.KPM }}" = "KPM" ]; then
            cp "${KPM_DIR}/patch_linux" .
            chmod +x patch_linux
            ./patch_linux
          else
            cp "${KPN_DIR}/kptools-linux" "${KPN_DIR}/kpimg-linux" .
            chmod +x ./kptools-linux
            ./kptools-linux -p -i ./Image -k ./kpimg-linux -o ./oImage
          fi
          mv -f oImage Image
          cp Image "${GITHUB_WORKSPACE}/AnyKernel3/Image"

      - name: Download Manager APK
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MANAGER_ARTIFACT="${{ steps.manager.outputs.manager_artifact }}"
          MANAGER_REPO="${{ steps.manager.outputs.manager_repo }}"

          # 下载指定 CI 运行中的管理器构建产物
          ATTACHED=()
          fetch_artifact() {  # 运行ID [产物名...]（默认 $MANAGER_ARTIFACT）
            local run=$1 url="" art="" code="" name=""; shift
            local names=("$@"); [[ ${#names[@]} -gt 0 ]] || names=("$MANAGER_ARTIFACT")
            for art in "${names[@]}"; do
              url=$(gh api "repos/${MANAGER_REPO}/actions/runs/${run}/artifacts?per_page=100" \
                --jq ".artifacts[] | select(.name == \"$art\" and (.expired | not)) | .archive_download_url" | head -n1 || true)
              [[ -n "$url" ]] && break
            done
            [[ -n "$url" ]] || return 1
            echo "下载 CI 产物: $art（运行 $run）"
            curl -fL --retry 3 -H "Authorization: token $GITHUB_TOKEN" -o "${art}.zip" "$url" || return 1
            # 产物里有多个架构，只要 arm64-v8a（没有时才全部解压）
            local tmp; tmp=$(mktemp -d)
            unzip -oj "${art}.zip" "*.apk" -d "$tmp" >/dev/null
            local apks=("$tmp"/*arm64-v8a*.apk)
            [[ -f "${apks[0]}" ]] || apks=("$tmp"/*.apk)
            local attached_before=${#ATTACHED[@]}
            for apk in "${apks[@]}"; do
              [[ -f "$apk" ]] || continue
              if [[ "$IS_RESUKISU" == "true" ]]; then
                code=$(python3 "$GITHUB_WORKSPACE/scripts/apk_version_code.py" "$apk" 2>/dev/null || true)
                if [[ "$code" != "$KSUVER" ]]; then
                  echo "::warning title=Manager::拒绝附带版本号 ${code:-未知} 的管理器；当前 BakaSU 内核版本号是 $KSUVER"
                  continue
                fi
              fi
              name=$(basename "$apk")
              [[ "$art" == *[Ss]poofed* && "$name" != *[Ss]poofed* ]] && name="Spoofed_${name}"
              mv "$apk" "./AnyKernel3/$name"
              ATTACHED+=("$name")
              echo "已附带: $name"
            done
            rm -rf "$tmp"
            [[ ${#ATTACHED[@]} -gt $attached_before ]]
          }

          if [[ "$IS_RESUKISU" == "true" ]]; then
            # 1) 固定 release 的普通管理器：直接取 release 附件
            if [[ -n "${RESUKISU_RELEASE:-}" && "$MANAGER_ARTIFACT" == "Manager-release" ]]; then
              APK=$(gh api "repos/${MANAGER_REPO}/releases/tags/${RESUKISU_RELEASE}" \
                --jq '.assets[] | select(.name | endswith("-arm64-v8a-release.apk")) | .browser_download_url' | head -n1)
              if [[ -n "$APK" ]]; then
                echo "下载 ${RESUKISU_RELEASE} 管理器: $APK"
                curl -fL --retry 3 -o "./AnyKernel3/$(basename "$APK")" "$APK"
                exit 0
              fi
              echo "::warning title=Manager::${RESUKISU_RELEASE} 没有找到 arm64 管理器，改用同一提交的 CI 构建"
            fi

            # 2) BakaSU 固定提交（包括默认 5b76b884）及自定义版本：只取同一提交的 CI 构建
            RUN_ID=$(gh api "repos/${MANAGER_REPO}/actions/workflows/build-manager.yml/runs?head_sha=${KSU_SHA}&status=success&per_page=20" \
              --jq "[.workflow_runs[] | select(.event == \"push\" and .head_sha == \"$KSU_SHA\")][0].id // empty" || true)
            if [[ -n "$RUN_ID" ]] && fetch_artifact "$RUN_ID"; then
              exit 0
            fi

            # 3) 同一提交的 CI 产物已过期（保留 90 天）或不存在
            if [[ -n "${RESUKISU_RELEASE:-}" && "$MANAGER_ARTIFACT" != "Manager-release" ]]; then
              APK=$(gh api "repos/${MANAGER_REPO}/releases/tags/${RESUKISU_RELEASE}" \
                --jq '.assets[] | select(.name | endswith("-arm64-v8a-release.apk")) | .browser_download_url' | head -n1)
              if [[ -n "$APK" ]]; then
                echo "::warning title=Manager::${RESUKISU_RELEASE} 的伪装版管理器已过期，改为附带同版本的普通管理器"
                curl -fL --retry 3 -o "./AnyKernel3/$(basename "$APK")" "$APK"
                exit 0
              fi
            fi
            echo "::warning title=Manager::没有找到与内核 ${KSU_SHA::8} 对应的管理器，本次不附带管理器（不会改用其他版本，避免内核和管理器不匹配）"
            exit 0
          fi

          # SukiSU-Ultra：管理器已在编译前选好（Pair SukiSU-Ultra Manager 步骤），内核版本号与它一致
          shopt -s nullglob
          APKS=("$GITHUB_WORKSPACE"/manager_apk/*.apk)
          if [[ ${#APKS[@]} -eq 0 ]]; then
            echo "::warning title=Manager::本次不附带 SukiSU-Ultra 管理器（原因见 Pair SukiSU-Ultra Manager 步骤）"
            exit 0
          fi
          for apk in "${APKS[@]}"; do
            mv "$apk" ./AnyKernel3/ && echo "已附带: $(basename "$apk")"
          done

      - name: Set zip Suffix
        id: suffix
        run: |
          echo "value=${{ env.IS_RESUKISU != 'true' && (github.event.inputs.KPM == 'KPM' && '_KPM' || github.event.inputs.KPM == 'KPN' && '_KPN') || '' }}${{ github.event.inputs.LSM_BBG == 'true' && '_BBG' || '' }}_ILH${{ github.event.inputs.DROID_SPACES== 'true' && '_DS' || '' }}${{ github.event.inputs.RE_KERNEL == 'true' && '_REKER' || '' }}" >> $GITHUB_OUTPUT

      - name: Pack AnyKernel3 Zip
        id: pack_ak3
        run: |
          ZIP_NAME="AnyKernel3_${{ env.IS_RESUKISU == 'true' && 'BakaSU' || 'SukiSUUltra' }}_${{ env.KSUVER }}_${{ steps.extract_info.outputs.value }}_${{ env.TKERNEL_VERSION }}${{ steps.suffix.outputs.value }}.zip"
          cd ./AnyKernel3
          zip -r "../${ZIP_NAME}" ./*
          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload AnyKernel3
        uses: actions/upload-artifact@v7
        with:
          name: AnyKernel3_${{ env.IS_RESUKISU == 'true' && 'BakaSU' || 'SukiSUUltra' }}_${{ env.KSUVER }}_${{ steps.extract_info.outputs.value }}_${{ env.TKERNEL_VERSION }}${{ steps.suffix.outputs.value }}
          path: ./${{ steps.pack_ak3.outputs.zip_name }}

      - name: Publish Release
        if: ${{ success() && github.event.inputs.RELEASE == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.pack_ak3.outputs.zip_name }}
          INPUT_JSON: ${{ toJSON(github.event.inputs) }}
        run: |
          TAG="build-${{ github.run_number }}"
          KSU_LABEL="${{ env.IS_RESUKISU == 'true' && 'BakaSU' || 'SukiSU-Ultra' }}"
          TITLE="#${{ github.run_number }} ${KSU_LABEL} ${KSU_NAME:-$KSUVER}"
          [[ -n "${SUSFS_VER:-}" ]] && TITLE="$TITLE + SUSFS ${SUSFS_VER}"
          # 不是固定的正式版本时标记为预发布
          PRE=""
          if [[ "${KSU_PINNED:-false}" != "true" ]] || [[ "${KSU_NAME:-}" =~ -(rc|alpha|beta)[0-9]* ]]; then PRE="--prerelease"; fi

          ASSETS=("$ZIP")
          for apk in AnyKernel3/*.apk; do [[ -f "$apk" ]] && ASSETS+=("$apk"); done
          if [[ ${#ASSETS[@]} -eq 1 ]]; then
            echo "::warning title=Manager::本次 Release 没有附带管理器 APK，请查看 Download Manager APK 步骤"
            NO_APK=true
          fi
          SHA=$(sha256sum "$ZIP" | cut -d' ' -f1)

          {
            echo "一加 Ace 竞速版（oneplus_ace_race_t）内核，Android 13，Linux ${TKERNEL_VERSION}"
            echo
            echo "| 组件 | 版本 |"
            echo "|---|---|"
            echo "| ${KSU_LABEL} | ${KSU_NAME:-?}（版本号 ${KSUVER}，提交 ${KSU_SHA::8}） |"
            [[ -n "${SUSFS_VER:-}" ]] && echo "| SUSFS | ${SUSFS_VER}（${SUSFS_SHA}） |"
            [[ "${{ github.event.inputs.LSM_BBG }}" == "true" ]] && echo "| Baseband-guard | ${BBG_COMMIT::8} |"
            echo "| AnyKernel3 | ${AK3_COMMIT::8} |"
            echo "| 工作流 | [${GITHUB_SHA::7}](${{ github.server_url }}/${{ github.repository }}/commit/${GITHUB_SHA}) · [运行记录](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |"
            echo
            echo "**选项**：$(jq -r 'to_entries | map(select(.value != "" and .value != "false" and .value != "N/A" and (.key | IN("RELEASE") | not))) | map(if .value == "true" then .key else "\(.key)=\(.value)" end) | join(" · ")' <<< "$INPUT_JSON")"
            echo
            echo "**SHA-256**：\`${SHA}\`"
            echo
            [[ "${NO_APK:-}" == true ]] && echo "> ⚠️ 本次没有附带管理器，请使用与内核同版本的管理器。" && echo
            echo "刷入前请备份 boot 分区。"
          } > release_notes.md
          cat release_notes.md

          gh release create "$TAG" "${ASSETS[@]}" --repo "${{ github.repository }}" \
            --target "$GITHUB_SHA" --title "$TITLE" --notes-file release_notes.md $PRE

      - name: Post-build Disk Check
        run: df -h
