name: Daily Maintenance

# 每天北京时间 09:17 运行：检查上游新版本、保持 ccache 缓存不过期
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  check-updates:
    name: 检查上游更新
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compare with pinned versions
        env:
          GH_TOKEN: ${{ github.token }}
          RESUKISU_REPO: Baka-SU/BakaSU
          SUSFS_PROJECT: simonpunk%2Fsusfs4ksu
          SUSFS_BRANCH: gki-android12-5.10
          LABEL: upstream-update
          # 看过但暂不跟进的上游提交（空格分隔），最新提交是其中之一时不提醒
          REVIEWED: >-
            47f23f7ece3ef212a392ec9ea5466e5f0b55d3c7
        run: |
          set -euo pipefail
          WF=".github/workflows/Build Kernel OnePlus.yml"
          CUR_TAG=$(grep -oP 'RESUKISU_TAG="\K[^"]+' "$WF")
          CUR_RESUKISU=$(grep -oP 'RESUKISU_COMMIT="\K[0-9a-f]{40}' "$WF")
          CUR_SUSFS=$(grep -oP 'STABLE_SUSFS_COMMIT="\K[0-9a-f]+' "$WF")
          CUR_AK3=$(grep -oP '^ +AK3_COMMIT: \K[0-9a-f]{40}' "$WF")
          CUR_BBG=$(grep -oP '^ +BBG_COMMIT: \K[0-9a-f]{40}' "$WF")
          CUR_SUKISU=$(grep -oP 'SUKISU_BUILTIN_COMMIT="\K[0-9a-f]{40}' "$WF")
          CUR_SUKISU_PATCH=$(grep -oP '^ +SUKISU_PATCH_COMMIT: \K[0-9a-f]{40}' "$WF")
          echo "当前固定: BakaSU ${CUR_RESUKISU::8}（标签基线 $CUR_TAG）, SukiSU-Ultra builtin ${CUR_SUKISU::8}, SUSFS ${CUR_SUSFS::8}, AnyKernel3 ${CUR_AK3::8}, Baseband-guard ${CUR_BBG::8}, SukiSU_patch ${CUR_SUKISU_PATCH::8}"

          BODY=""

          # BakaSU 从 48fa4bb（2026-10-10）起在 kernel/tools/susfs_compat.mk 里用 $(error ...) 禁止带 SUSFS 编译，
          # 要等 SUSFS 跟上新版 KernelSU 才会去掉。返回 0 = 该引用仍禁止，1 = 没有限制；读取失败时让任务报错
          susfs_blocked() {
            local code
            code=$(curl -sSL -o "$RUNNER_TEMP/susfs_compat.mk" -w '%{http_code}' \
              "https://raw.githubusercontent.com/${RESUKISU_REPO}/$1/kernel/tools/susfs_compat.mk")
            case "$code" in
              200) grep -qE '^[[:space:]]*\$\(error' "$RUNNER_TEMP/susfs_compat.mk" ;;
              404) return 1 ;;
              *) echo "::error::读取 $1 的 susfs_compat.mk 失败（HTTP $code）"; exit 1 ;;
            esac
          }

          # ReSukiSU：最新发布（含预发布，跳过草稿）
          read -r NEW_TAG NEW_PRE NEW_URL < <(gh api "repos/${RESUKISU_REPO}/releases?per_page=10" \
            --jq '[.[] | select(.draft | not)][0] | "\(.tag_name) \(.prerelease) \(.html_url)"')
          if [[ "$NEW_TAG" != "$CUR_TAG" ]]; then
            KIND=$([[ "$NEW_PRE" == true ]] && echo "预发布" || echo "正式版")
            BODY+="### ReSukiSU ${NEW_TAG}（${KIND}）"$'\n'
            BODY+="当前固定 BakaSU \`${CUR_RESUKISU::8}\`（标签基线 \`${CUR_TAG}\`）→ 最新 [\`${NEW_TAG}\`](${NEW_URL})"$'\n\n'
            if susfs_blocked "$NEW_TAG"; then
              BODY+="> ⚠️ \`${NEW_TAG}\` 的源码仍禁止带 SUSFS 编译（\`Please wait susfs update.\`），构建会失败，暂勿升级。"$'\n\n'
            fi
          elif ! susfs_blocked main; then
            # 还没有新 release，但 main 已经解除限制：提醒一次，便于提前测试
            case "$(gh api "repos/${RESUKISU_REPO}/issues/622" --jq '.state' 2>/dev/null)" in
              open) ISSUE_622="未修复（open）" ;;
              closed) ISSUE_622="已关闭（closed），请看 issue 里是否已修复" ;;
              *) ISSUE_622="未知" ;;
            esac
            BODY+="### BakaSU main 已解除 SUSFS 编译限制"$'\n'
            BODY+="main 分支的 \`kernel/tools/susfs_compat.mk\` 里已经没有 \`Please wait susfs update.\`，但还没有新 release。"
            BODY+="可以用 \`KSU_META=//<main 提交哈希>\` 先编译测试，或等正式发布。"$'\n\n'
            BODY+="[#622](https://github.com/${RESUKISU_REPO}/issues/622)（旧内核开启隐藏 SELinux 后终端 exec 被拒；上游说明为 5.4/4.19/4.14，不能直接套用到 5.10）当前状态：${ISSUE_622}"$'\n\n'
          fi

          MAIN_SHA=$(gh api "repos/${RESUKISU_REPO}/commits/main" --jq '.sha')
          if [[ "$MAIN_SHA" != "$CUR_RESUKISU" ]] && susfs_blocked "$MAIN_SHA"; then
            BODY+="### BakaSU 主线暂勿跟进"$'\n'
            BODY+="当前固定 \`${CUR_RESUKISU::8}\`；最新主线 \`${MAIN_SHA::8}\` 仍有 SUSFS 编译限制，保持固定提交，不自动升级。"$'\n\n'
          fi

          # SUSFS：分支最新提交（与保底提交不同时提醒，并检查与固定 KernelSU 的接口兼容性）
          API="https://gitlab.com/api/v4/projects/${SUSFS_PROJECT}/repository"
          HEAD=$(curl -fsSL "${API}/branches/${SUSFS_BRANCH}" | jq -r '.commit.id')
          if [[ "$HEAD" != "$CUR_SUSFS" ]]; then
            VER=$(curl -fsSL "https://gitlab.com/simonpunk/susfs4ksu/-/raw/${HEAD}/kernel_patches/include/linux/susfs.h" \
              | grep -oP 'SUSFS_VERSION "\K[^"]+' || echo "?")
            COMMITS=$(curl -fsSL "${API}/compare?from=${CUR_SUSFS}&to=${HEAD}" \
              | jq -r '.commits | reverse | .[:20][] | "- `\(.short_id)` \(.title)"')
            # 构建默认自动使用与固定 KernelSU 接口兼容的最新 SUSFS 提交；这里报告最新提交的兼容情况
            git clone -q --depth=1 -b "$SUSFS_BRANCH" https://gitlab.com/simonpunk/susfs4ksu.git "$RUNNER_TEMP/susfs"
            ksu_compat() {  # 名称 仓库 提交
              local d="$RUNNER_TEMP/ksu-${3::8}" missing
              mkdir -p "$d"
              if ! curl -fsSL "https://codeload.github.com/$2/tar.gz/$3" \
                   | tar -xz -C "$d" --strip-components=1 --wildcards '*/kernel/*'; then
                echo "- $1 \`${3::8}\`：⚠️ 下载源码失败，未检查"; return 0
              fi
              if python3 scripts/susfs_ksu_check.py "$RUNNER_TEMP/susfs/kernel_patches" "$d/kernel" > "$d.log"; then
                echo "- $1 \`${3::8}\`：✅ 兼容，构建会自动使用最新 SUSFS"
              else
                missing=$(grep -oP '✗ \K[^:]+' "$d.log" | sed 's/.*/`&`/' | paste -sd' ' || true)
                echo "- $1 \`${3::8}\`：❌ 不兼容，构建会自动回退到较早的兼容提交（缺少 ${missing:-?}）"
              fi
            }
            BODY+="### SUSFS ${VER}（${SUSFS_BRANCH}）"$'\n'
            BODY+="保底提交 \`${CUR_SUSFS::8}\` → 最新 [\`${HEAD::8}\`](https://gitlab.com/simonpunk/susfs4ksu/-/commits/${SUSFS_BRANCH})。构建默认自动使用与固定 KernelSU 接口兼容的最新提交，最新提交的检查结果："$'\n\n'
            BODY+="$(ksu_compat BakaSU "$RESUKISU_REPO" "$CUR_RESUKISU")"$'\n'
            BODY+="$(ksu_compat "SukiSU-Ultra builtin" SukiSU-Ultra/SukiSU-Ultra "$CUR_SUKISU")"$'\n\n'
            BODY+="${COMMITS}"$'\n\n'
          fi

          # SukiSU-Ultra builtin / AnyKernel3 / Baseband-guard / SukiSU_patch：分支最新提交
          check_github() {  # 名称 仓库 当前固定提交 [分支，默认为仓库默认分支]
            local name=$1 repo=$2 cur=$3 branch=${4:-} head commits
            head=$(gh api "repos/${repo}/commits?per_page=1${branch:+&sha=$branch}" --jq '.[0].sha')
            [[ "$head" == "$cur" || " $REVIEWED " == *" $head "* ]] && return 0
            commits=$(gh api "repos/${repo}/compare/${cur}...${head}" \
              --jq '.commits | reverse | .[:20][] | "- `\(.sha[:7])` \(.commit.message | split("\n")[0])"')
            BODY+="### ${name}"$'\n'
            BODY+="当前固定 \`${cur::8}\` → 最新 [\`${head::8}\`](https://github.com/${repo}/commits/${branch})"$'\n\n'
            BODY+="${commits}"$'\n\n'
          }
          # SukiSU-Ultra builtin 更新后需重新核对与固定 SUSFS 的接口（scripts/ksu_susfs_compat.py）
          check_github "SukiSU-Ultra（builtin 分支）" SukiSU-Ultra/SukiSU-Ultra "$CUR_SUKISU" builtin
          check_github AnyKernel3 Numbersf/AnyKernel3 "$CUR_AK3"
          check_github Baseband-guard vc-teahouse/Baseband-guard "$CUR_BBG"
          check_github "SukiSU_patch（KPM 工具）" SukiSU-Ultra/SukiSU_patch "$CUR_SUKISU_PATCH"

          ISSUE=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number // empty' 2>/dev/null || true)
          if [[ -z "$BODY" ]]; then
            echo "已是最新"
            [[ -n "$ISSUE" ]] && gh issue close "$ISSUE" --comment "固定版本已更新到最新，自动关闭。"
            exit 0
          fi

          BODY="上游有新版本。更新时修改工作流中的 \`RESUKISU_COMMIT\`（只有切回 release 源码才同步 \`RESUKISU_TAG\` / \`RESUKISU_RELEASE_COMMIT\`） / \`SUKISU_BUILTIN_COMMIT\` / \`STABLE_SUSFS_COMMIT\`（SUSFS 保底提交；构建默认已自动跟随最新兼容提交） / \`AK3_COMMIT\` / \`BBG_COMMIT\` / \`SUKISU_PATCH_COMMIT\`，构建通过并刷机验证后再发布。"$'\n\n'"$BODY"
          echo "$BODY"
          if [[ -z "$ISSUE" ]]; then
            gh label create "$LABEL" --color FBCA04 --description "上游有新版本" 2>/dev/null || true
            gh issue create --title "上游有新版本" --label "$LABEL" --body "$BODY"
          elif [[ "$(gh issue view "$ISSUE" --json body --jq .body)" != "$BODY" ]]; then
            gh issue edit "$ISSUE" --body "$BODY"
            gh issue comment "$ISSUE" --body "上游又有更新，已刷新上面的列表。"
          fi

  ccache-keepalive:
    name: ccache 保活
    runs-on: ubuntu-latest
    steps:
      # GitHub 会删除 7 天没被访问的缓存；每天恢复一次最新的 ccache，让它保持“最近使用”
      # path 必须与编译工作流中的 CCACHE_DIR 完全一致，否则匹配不到
      - name: Touch latest ccache
        id: restore
        uses: actions/cache/restore@v6
        with:
          path: /home/runner/.ccache_oneplus_ace_race_t
          key: ccache-keepalive-never-matches
          restore-keys: |
            ccache-Linux-main-oneplus_ace_race_t-gki-alpha-16.2

      - name: Report
        run: |
          if [[ -n "${{ steps.restore.outputs.cache-matched-key }}" ]]; then
            echo "已访问缓存: ${{ steps.restore.outputs.cache-matched-key }}"
            du -sh /home/runner/.ccache_oneplus_ace_race_t
          else
            echo "::notice::没有找到 ccache 缓存（还没编译过，或已被清理）"
          fi

      # 公开仓库 60 天没有提交时，GitHub 会停用定时工作流；定期重新启用以重置计时
      - name: Keep schedule enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/maintenance.yml/enable"
