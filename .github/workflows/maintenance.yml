name: Daily Maintenance

# 每天北京时间 09:17 运行：检查上游新版本、保持 ccache 缓存不过期
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  check-updates:
    name: 检查上游更新
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Compare with pinned versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/maintenance.py

  ccache-keepalive:
    name: ccache 保活
    runs-on: ubuntu-latest
    steps:
      # GitHub 会删除 7 天没被访问的缓存；每天恢复一次最新的 ccache，让它保持“最近使用”
      # path 必须与编译工作流中的 CCACHE_DIR 完全一致，否则匹配不到
      - name: Touch latest ccache
        id: restore
        uses: actions/cache/restore@v6
        with:
          path: /home/runner/.ccache_oneplus_ace_race_t
          key: ccache-keepalive-never-matches
          restore-keys: |
            ccache-Linux-main-oneplus_ace_race_t-gki-alpha-16.2

      - name: Report
        run: |
          if [[ -n "${{ steps.restore.outputs.cache-matched-key }}" ]]; then
            echo "已访问缓存: ${{ steps.restore.outputs.cache-matched-key }}"
            du -sh /home/runner/.ccache_oneplus_ace_race_t
          else
            echo "::notice::没有找到 ccache 缓存（还没编译过，或已被清理）"
          fi

      # 公开仓库 60 天没有提交时，GitHub 会停用定时工作流；定期重新启用以重置计时
      - name: Keep schedule enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/maintenance.yml/enable"
